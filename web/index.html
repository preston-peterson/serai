<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- viewport-fit=cover plus the safe-area paddings make the app reach the
       real screen edges on a phone; initial-scale=1 keeps inputs from zooming. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0e1116" />
  <!-- PWA: Add to Home Screen opens serai standalone, reusing the login cookie.
       No service worker: the terminals are live and must never be cached. -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="serai" />
  <title>serai</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
  <link rel="apple-touch-icon" href="/static/icon-180.png" />
  <link rel="manifest" href="/static/manifest.webmanifest" />
  <link rel="stylesheet" href="/static/lib/xterm.css" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div id="app" hidden>
    <header id="topbar" class="topbar"></header>
    <div class="layout">
      <aside id="rail" class="rail"></aside>
      <section class="main">
        <div id="panes" class="panes"></div>
        <div id="drawer" class="drawer" hidden></div>
      </section>
    </div>
  </div>
  <!-- xterm 5.5 + addons: classic scripts (UMD globals), see lib/VERSIONS -->
  <script src="/static/lib/xterm.js"></script>
  <script src="/static/lib/addon-fit.js"></script>
  <script src="/static/lib/addon-clipboard.js"></script>
  <script src="/static/lib/addon-web-links.js"></script>
  <script src="/static/lib/addon-search.js"></script>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
